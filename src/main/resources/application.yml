spring:
  application:
    name: finwallet-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finwallet}
    username: ${DB_USERNAME:finwallet}
    password: ${DB_PASSWORD:finwallet}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b}
    access-token-expiration: 900000 # 15 minutos
    refresh-token-expiration: 604800000 # 7 días

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html